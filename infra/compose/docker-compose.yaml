services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: doro_order
      POSTGRES_USER: doro
      POSTGRES_PASSWORD: doro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doro -d doro_order"]
      interval: 5s
      retries: 10
    volumes: ["pgdata:/var/lib/postgresql/data"]
volumes:
  pgdata:
